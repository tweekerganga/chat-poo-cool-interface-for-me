<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #07213a; 

            background-repeat: repeat;
        }

        .chat-box {
            background: black;
            width: 800px;
            max-width: 90vw;
          
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 600px;
            display: block;
            border: none;
        }


    </style>
</head>
<body background="https://i.ibb.co/KQMKFtH/oneko.gif">
  
  <div class="chat-box">
   <iframe src="https://chat.addachat.com/?bgs=off&bg=transparent&pfx=main&name=Guest&room=main&sidebar=on&format=on&images=on" height="600" width="90%" frameBorder="0" allowtransparency="true" allow="camera; microphone"></iframe>
  </div>


</body>
</html>
